[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelgate-classifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "joblib==1.4.2",
  "numpy==2.2.1",
  "pydantic==2.10.4",
  "scikit-learn==1.6.0",
  "scipy==1.15.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "anyio==4.15.1",
  "httpx2==2.12.0",
  "mypy==1.14.1",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "training*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true
