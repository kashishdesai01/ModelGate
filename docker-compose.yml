name: modelgate

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: modelgate
      POSTGRES_PASSWORD: modelgate
      POSTGRES_DB: modelgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelgate -d modelgate"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  classifier:
    image: modelgate-classifier:local
    build:
      context: .
      dockerfile: services/classifier/Dockerfile
    environment:
      MODEL_DIR: /app/models
    ports:
      - "127.0.0.1:${CLASSIFIER_PORT:-18000}:8000"

  llm-mock:
    image: modelgate-lite:local
    entrypoint: ["/usr/local/bin/llm-mock"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  seed:
    image: modelgate-lite:local
    command: ["seed"]
    environment:
      DATABASE_URL: postgres://modelgate:modelgate@postgres:5432/modelgate?sslmode=disable
      SEED_API_KEY: mg_demo_local_only_change_me
      SEED_MONTHLY_BUDGET_MICROUSD: "100000"
      SEED_RATE_CAPACITY: "1000"
      SEED_RATE_REFILL_PER_SEC: "1000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: modelgate-lite:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://modelgate:modelgate@postgres:5432/modelgate?sslmode=disable
      REDIS_ADDR: redis:6379
      CACHE_HMAC_SECRET: local-demo-hmac-secret-change-before-deploying
      CLASSIFIER_URL: http://classifier:8000
      CLASSIFIER_VERSION: baseline-v1
      LLM_MOCK_URL: http://llm-mock:8081
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      classifier:
        condition: service_healthy
      llm-mock:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
